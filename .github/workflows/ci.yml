name: CI

on:
  push:
    branches: [main, kicad11]
  pull_request:

permissions: read-all

jobs:
  checks:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      KICAD_FLOW_MONITOR: '0'
      # Preserve large example inputs; production still defaults to five.
      KICAD_FLOW_BATCH_LIMIT: '1000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Install KiCad 11 development build and libraries
        shell: pwsh
        run: |
          ./scripts/setup_kicad11_ci.ps1
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Install pinned official development IPC bindings
        shell: pwsh
        run: |
          python scripts/install_kicad_ipc.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ipcPython = (Resolve-Path out/kicad-ipc/venv/Scripts/python.exe).Path
          "KICAD_FLOW_IPC_PYTHON=$ipcPython" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Check installation
        run: python -m kicad_flow.server doctor
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Native schematic hierarchy, rollback and relocation
        run: python examples/scripts/schematic_ipc.py
      - name: Native schematic transforms, multi-unit symbols and CRUD
        run: python examples/scripts/schematic_native.py
      - name: Native PCB transforms, rollback and reload
        run: python examples/scripts/pcb_ipc.py
      - name: Native footprint field edits preserve arbitrary-angle geometry
        run: python examples/scripts/pcb_fields_ipc.py
      - name: Native scoped rules, preservation and atomic refusal
        run: python examples/scripts/pcb_rules_ipc.py
      - name: Native netclass ownership, inheritance and persistence
        run: python examples/scripts/net_policy_ipc.py
      - name: Native routing import, rounded outlines and refusal isolation
        run: python examples/scripts/routing_ipc.py
      - name: Default batch limit
        env:
          KICAD_FLOW_BATCH_LIMIT: '5'
        run: python examples/scripts/batch_limits.py
      - name: Configured batch limit
        env:
          KICAD_FLOW_BATCH_LIMIT: '7'
        run: python examples/scripts/batch_limits.py
      - name: Workflow context delivery
        env:
          KICAD_FLOW_BATCH_LIMIT: '5'
        run: python examples/scripts/workflow_context.py
      - name: Agent workspace and scoped MCP bridge (no model login needed)
        run: python examples/scripts/dashboard_chat.py
      - name: Staged board transfer
        env:
          KICAD_FLOW_BATCH_LIMIT: '5'
        run: python examples/scripts/staged_board_transfer.py
      - name: Flight-controller example
        run: python examples/scripts/fc.py
      - name: Schematic and PCB example
        run: python examples/scripts/led_digits.py
      - name: Schematic graphics example
        run: python examples/scripts/schematic_groups.py
      - name: Symbol-search example
        run: python examples/scripts/symbol_search.py
      - name: PCB text example
        run: python examples/scripts/pcb_text.py
      - name: Board session example
        run: python examples/scripts/board_session.py
      - name: FreeRouting exchange example
        run: python examples/scripts/freerouting_exchange.py
      - name: Manufacturing export example
        run: python examples/scripts/manufacturing.py
