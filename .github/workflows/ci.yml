name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  checks:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      KICAD_FLOW_MONITOR: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.10'
      - name: Install KiCad 10
        shell: pwsh
        run: |
          choco install kicad --version=10.0.6 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Check installation
        run: python -m kicad_flow.server doctor
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Flight-controller example
        run: python examples/scripts/fc.py
      - name: Schematic and PCB example
        run: python examples/scripts/led_digits.py
      - name: Symbol-search example
        run: python examples/scripts/symbol_search.py
