[project]
name = "kicad-flow"
version = "0.1.0"
description = "MCP server for authoring KiCad schematics with a readable visual flow"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0.0",  # MCP SDK v2 renamed the tool-annotation hints to snake_case
    "pymupdf>=1.24",  # rasterize schematic/board PDFs to viewable PNGs
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "ruff>=0.9",
    "mypy>=1.13",
]

[project.scripts]
kicad-flow = "kicad_flow.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The suite is process-spawn-bound (~150 tests each shell out to kicad-cli or
# KiCad's pcbnew), so run it across cores by default. Override with `-n0` for
# serial output / a debugger.
addopts = "-n auto"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Google-flavored ruleset: pyflakes/pycodestyle + isort, pyupgrade, bugbear,
# comprehensions, simplify, and Google-style docstrings.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "D", "RUF"]
# D203/D213 conflict with the Google convention's D211/D212; let convention win.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests don't need public-API docstrings.
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
# NOT ignore_missing_imports: it applies to our own modules too, and twice it
# turned an import broken by a move into `Any` -- once letting KiCadSheet
# subclass nothing while strict mode passed, once letting the whole package
# fail to import with mypy clean. Third-party stubs are exempted by name below.
ignore_missing_imports = false

# The render and monitor modules drive PyMuPDF, which ships no type stubs;
# don't flag its untyped calls there.
[[tool.mypy.overrides]]
module = [
    "kicad_flow.backend.kicad.render",
    "kicad_flow.monitor",
]
disallow_untyped_calls = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kicad_flow"]
